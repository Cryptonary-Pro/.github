name: Pull-request template contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate organization PR template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run contract tests
        run: python3 tests/test_validate_pull_request_template.py -v

      - name: Validate checked-in template
        run: python3 scripts/validate_pull_request_template.py
